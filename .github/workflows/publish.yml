# Stages a new npm version when a GitHub Release is published. npm trusted publishing (OIDC)
# authenticates the job, so no npm token is stored. A maintainer then approves the staged
# version with 2FA on npmjs.com (or `npm stage approve`) before it is public.
#
# The package supports Node 20 and later, but the toolchain needs Node 22.22. So the bundles
# are built and fully tested on Node 24, smoke-tested on Node 20, and that same build is what
# gets published.

name: Publish to npm

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-node@v7
      with:
        node-version: 24.x
        cache: 'npm'
    - name: Check the release tag matches package.json
      env:
        TAG: ${{ github.event.release.tag_name }}
      run: test "v$(node -p "require('./package.json').version")" = "$TAG"
    - run: npm ci
    - run: npm run typecheck
    - run: npm run lint
    - run: npm test
    - run: npm run test:isolated
    - run: npm run build
    - run: npm run test:smoke
    - uses: actions/upload-artifact@v7
      with:
        name: dist
        path: dist/
        if-no-files-found: error

  smoke:
    needs: build
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    # The `engines` floor, as in ci.yml's smoke job: change both together.
    - uses: actions/setup-node@v7
      with:
        node-version: 20
    - uses: actions/download-artifact@v8
      with:
        name: dist
        path: dist/
    # No npm ci: the smoke tests use only node:test, the built bundles and the shipped codemod.
    - run: npm run test:smoke

  publish:
    needs: [build, smoke]
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write   # lets npm exchange a GitHub OIDC token for a short-lived publish token

    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-node@v7
      with:
        node-version: 24.x
        registry-url: https://registry.npmjs.org
    - run: npm install -g npm@latest   # trusted publishing and staged publishing need a recent npm
    # The bundles built and tested above. The package has no prepare or prepublish scripts, so
    # nothing rebuilds them before packing.
    - uses: actions/download-artifact@v8
      with:
        name: dist
        path: dist/
    - run: npm stage publish
